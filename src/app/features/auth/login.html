<section class="login">
  <div class="login__card">
    <div class="login__header">
      <svg class="login__logo" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="12" fill="currentColor" />
        <path
          d="M6.5 15.2c3.4-1.5 7.3-1.2 10.8.6M7.2 12.2c3.8-1.7 8.2-1.3 12.1.8M7.8 9.2c4.3-1.9 9.2-1.5 13.5.8"
          fill="none"
          stroke="#121212"
          stroke-linecap="round"
          stroke-width="1.6"
        />
      </svg>
      <h1 class="login__title">Iniciar sesión</h1>
    </div>

    @if (error()) {
      <p class="login__error" role="alert" aria-live="polite">{{ error() }}</p>
    }

    <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="login__field">
        <label class="login__label" for="username">Usuario</label>
        <input
          id="username"
          class="login__input"
          [class.login__input--invalid]="isInvalid('username')"
          type="text"
          formControlName="username"
          placeholder="Nombre de usuario"
          autocomplete="username"
          [attr.aria-invalid]="isInvalid('username')"
        />
        @if (isInvalid('username')) {
          <span class="login__hint">
            <svg class="login__hint-icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path fill="currentColor" d="M7.25 4.5h1.5v5h-1.5zm0 6.25h1.5v1.5h-1.5z" />
            </svg>
            El usuario es obligatorio.
          </span>
        }
      </div>

      <div class="login__field">
        <label class="login__label" for="password">Contraseña</label>
        <div class="login__password">
          <input
            id="password"
            class="login__input"
            [class.login__input--invalid]="isInvalid('password')"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            [attr.aria-invalid]="isInvalid('password')"
          />
          <button
            class="login__toggle"
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        @if (isInvalid('password')) {
          <span class="login__hint">
            <svg class="login__hint-icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path fill="currentColor" d="M7.25 4.5h1.5v5h-1.5zm0 6.25h1.5v1.5h-1.5z" />
            </svg>
            La contraseña es obligatoria.
          </span>
        }
      </div>

      <button class="login__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</section>
