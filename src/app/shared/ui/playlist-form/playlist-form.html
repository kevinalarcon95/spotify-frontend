<div
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="playlist-form-title"
  (click)="$event.stopPropagation()"
>
  <header class="dialog__header">
    <h2 id="playlist-form-title" class="dialog__title">{{ title }}</h2>
    <button class="dialog__close" type="button" aria-label="Cerrar" (click)="close()" [disabled]="saving()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M6.2 5.1 12 10.9l5.8-5.8 1.1 1.1L13.1 12l5.8 5.8-1.1 1.1L12 13.1l-5.8 5.8-1.1-1.1L10.9 12 5.1 6.2z"
        />
      </svg>
    </button>
  </header>

  <form class="dialog__form" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <label class="dialog__sr-only" for="playlist-name">Nombre</label>
    <input
      #nameInput
      id="playlist-name"
      class="dialog__name"
      type="text"
      formControlName="name"
      autocomplete="off"
    />

    <div class="dialog__outlined">
      <label class="dialog__floating" for="playlist-description">Descripción</label>
      <textarea
        id="playlist-description"
        class="dialog__description"
        formControlName="description"
        placeholder="Añade una descripción opcional"
      ></textarea>
    </div>

    @if (error()) {
      <p class="dialog__error" role="alert">{{ error() }}</p>
    }

    <div class="dialog__actions">
      <button class="dialog__save" type="submit" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
